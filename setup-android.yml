name: Build Anton Service POS Android

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify repository
        run: |
          set -e
          test -f package.json
          test -f capacitor.config.ts
          test -f "icon Anton Service Pos.png"
          test -f MainActivity.java
          test -f BluetoothPrinterBridge.java
          echo "Repository structure OK."

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify toolchain
        run: |
          set -e
          node --version
          pnpm --version
          java -version
          javac -version

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Prepare Anton Service POS web icon
        run: |
          set -e
          mkdir -p public/icons
          cp "icon Anton Service Pos.png" public/icons/anton-service-pos.png
          test -s public/icons/anton-service-pos.png
          file public/icons/anton-service-pos.png || true
          ls -lh public/icons/anton-service-pos.png

      - name: TypeScript check
        run: pnpm check

      - name: Build web application
        run: |
          set -e
          pnpm build
          test -d dist
          test -f dist/index.html
          echo "Web build OK."

      - name: Add Android platform
        run: |
          set -e
          npx cap add android
          test -d android
          test -f android/gradlew
          test -f android/settings.gradle
          test -f android/app/build.gradle
          echo "Android project created."

      - name: Sync Capacitor
        run: |
          set -e
          npx cap sync android
          test -d android
          test -f android/app/src/main/AndroidManifest.xml
          echo "Capacitor sync OK."

      - name: Install AntonPOS native Android files
        run: |
          set -e
          NATIVE_DIR="android/app/src/main/java/com/antonservice/pos"
          mkdir -p "$NATIVE_DIR"

          test -f MainActivity.java
          test -f BluetoothPrinterBridge.java

          cp MainActivity.java "$NATIVE_DIR/MainActivity.java"
          cp BluetoothPrinterBridge.java "$NATIVE_DIR/BluetoothPrinterBridge.java"

          test -s "$NATIVE_DIR/MainActivity.java"
          test -s "$NATIVE_DIR/BluetoothPrinterBridge.java"

          echo "Native Android files installed."

      - name: Configure Android permissions
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          if not manifest.exists():
              raise SystemExit("ERROR: AndroidManifest.xml tidak ditemukan.")

          text = manifest.read_text(encoding="utf-8")
          marker = "<application"
          if marker not in text:
              raise SystemExit("ERROR: tag <application> tidak ditemukan.")

          permissions = [
              '<uses-permission android:name="android.permission.CAMERA" />',
              '<uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />',
              '<uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />',
              '<uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />',
              '<uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />',
              '<uses-permission android:name="android.permission.INTERNET" />',
          ]

          for permission in permissions:
              permission_name = permission.split('android:name="', 1)[1].split('"', 1)[0]
              if f'android:name="{permission_name}"' not in text:
                  text = text.replace(marker, f"    {permission}\n\n    {marker}", 1)

          manifest.write_text(text, encoding="utf-8")

          # Final XML validation before Gradle.
          ET.parse(manifest)
          print("AndroidManifest.xml valid.")
          PY

          grep -n "android.permission" android/app/src/main/AndroidManifest.xml

      - name: Install Anton Service POS launcher icon
        run: |
          set -e
          ICON_DIR="android/app/src/main/res/drawable-nodpi"
          ICON="$ICON_DIR/anton_service_pos.png"
          mkdir -p "$ICON_DIR"

          cp "icon Anton Service Pos.png" "$ICON"
          test -s "$ICON"

          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text(encoding="utf-8")

          icon_value = '@drawable/anton_service_pos'

          if re.search(r'android:icon="[^"]*"', text):
              text = re.sub(
                  r'android:icon="[^"]*"',
                  f'android:icon="{icon_value}"',
                  text,
                  count=1,
              )
          else:
              text = text.replace(
                  '<application',
                  f'<application\n        android:icon="{icon_value}"',
                  1,
              )

          if re.search(r'android:roundIcon="[^"]*"', text):
              text = re.sub(
                  r'android:roundIcon="[^"]*"',
                  f'android:roundIcon="{icon_value}"',
                  text,
                  count=1,
              )
          else:
              text = text.replace(
                  f'android:icon="{icon_value}"',
                  f'android:icon="{icon_value}"\n        android:roundIcon="{icon_value}"',
                  1,
              )

          manifest.write_text(text, encoding="utf-8")
          ET.parse(manifest)
          print("AndroidManifest.xml valid after icon configuration.")
          PY

          grep -n "android:icon\|android:roundIcon" android/app/src/main/AndroidManifest.xml
          ls -lh "$ICON"

      - name: Validate Android manifest
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          ET.parse(manifest)
          text = manifest.read_text(encoding="utf-8")

          required_permissions = [
              "android.permission.CAMERA",
              "android.permission.BLUETOOTH",
              "android.permission.BLUETOOTH_ADMIN",
              "android.permission.BLUETOOTH_SCAN",
              "android.permission.BLUETOOTH_CONNECT",
              "android.permission.INTERNET",
          ]

          for permission in required_permissions:
              if f'android:name="{permission}"' not in text:
                  raise SystemExit(f"ERROR: permission hilang: {permission}")

          if 'android:icon="@drawable/anton_service_pos"' not in text:
              raise SystemExit("ERROR: launcher icon belum terpasang.")

          if 'android:roundIcon="@drawable/anton_service_pos"' not in text:
              raise SystemExit("ERROR: roundIcon belum terpasang.")

          print("AndroidManifest.xml FINAL VALID.")
          PY

      - name: Verify native printer bridge
        run: |
          set -e
          BRIDGE="android/app/src/main/java/com/antonservice/pos/BluetoothPrinterBridge.java"

          test -s "$BRIDGE"
          grep -q 'import com.getcapacitor.PluginMethod;' "$BRIDGE"
          grep -q '@CapacitorPlugin(name = "BluetoothPrinterBridge")' "$BRIDGE"
          grep -q 'buildWarrantyBarcode' "$BRIDGE"
          grep -q 'buildLogoRaster' "$BRIDGE"
          grep -q 'printBluetooth' "$BRIDGE"
          grep -q 'printWifi' "$BRIDGE"

          echo "Bluetooth/Wi-Fi printer bridge verification OK."

      - name: Verify MainActivity
        run: |
          set -e
          MAIN="android/app/src/main/java/com/antonservice/pos/MainActivity.java"

          test -s "$MAIN"
          grep -q 'class MainActivity extends BridgeActivity' "$MAIN"
          grep -q 'BluetoothPrinterBridge.class' "$MAIN"
          grep -q 'BLUETOOTH_SCAN' "$MAIN"
          grep -q 'BLUETOOTH_CONNECT' "$MAIN"

          echo "MainActivity verification OK."

      - name: Verify Android Gradle project
        run: |
          set -e
          test -f android/gradlew
          test -f android/settings.gradle
          test -f android/build.gradle
          test -f android/app/build.gradle
          chmod +x android/gradlew
          echo "Android Gradle project OK."

      - name: Build Android APK
        working-directory: android
        run: |
          set -e
          chmod +x gradlew
          ./gradlew --version
          ./gradlew --stop || true
          ./gradlew clean --no-daemon
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Verify generated APK
        run: |
          set -e
          mapfile -t APKS < <(find android/app/build -type f -name '*.apk' -print)

          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "ERROR: APK tidak ditemukan."
            exit 1
          fi

          echo "APK yang ditemukan:"
          printf '%s\n' "${APKS[@]}"

      - name: Prepare APK artifact
        run: |
          set -e
          mkdir -p release

          APK="$(find android/app/build -type f -path '*/outputs/apk/debug/*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            APK="$(find android/app/build -type f -name '*.apk' -print -quit)"
          fi

          test -n "$APK"
          cp "$APK" release/AntonPOS-debug.apk
          test -s release/AntonPOS-debug.apk

          echo "Final APK:"
          ls -lh release/AntonPOS-debug.apk

      - name: Upload Anton Service POS APK
        uses: actions/upload-artifact@v4
        with:
          name: AntonPOS-debug-apk
          path: release/AntonPOS-debug.apk
          if-no-files-found: error
          retention-days: 14
