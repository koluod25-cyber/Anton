name: Build Anton Service POS APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm check
      - name: Build web and server
        run: pnpm build
      - name: Upload web build
        uses: actions/upload-artifact@v6
        with:
          name: anton-service-pos-web-build
          path: dist/

  build-apk:
    needs: build-web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Capacitor tooling
        run: pnpm add -D @capacitor/cli @capacitor/core @capacitor/android
      - name: Initialize Capacitor if missing
        run: |
          if [ ! -f capacitor.config.ts ] && [ ! -f capacitor.config.json ]; then
            npx cap init "Anton Service POS" "com.antonservice.pos" --web-dir dist/public
          fi
          if [ ! -d android ]; then
            npx cap add android
          fi
      - name: Build web assets
        run: pnpm build
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: anton-service-pos-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
