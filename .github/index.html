    <style>
      #startup-splash { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; background: radial-gradient(circle at 50% 42%, #2a3442 0%, #19202a 52%, #111720 100%); color: white; opacity: 1; transition: opacity 520ms cubic-bezier(.23,1,.32,1), visibility 520ms cubic-bezier(.23,1,.32,1); }
      #startup-splash.is-hidden { opacity: 0; visibility: hidden; pointer-events: none; }
      #startup-splash .splash-inner { display: grid; justify-items: center; gap: 18px; animation: splash-rise 820ms cubic-bezier(.23,1,.32,1) both; }
      #startup-splash img { width: min(42vw, 220px); height: min(42vw, 220px); object-fit: cover; border-radius: 50%; box-shadow: 0 0 0 8px rgba(255,255,255,.08), 0 18px 50px rgba(0,0,0,.35); animation: splash-zoom-cycle 1650ms cubic-bezier(.23,1,.32,1) both; }
      #startup-splash p { margin: 0; font: 800 11px/1.2 Manrope, sans-serif; letter-spacing: .22em; text-transform: uppercase; color: #f3c64b; }
      #startup-splash .splash-loading { display: grid; justify-items: center; gap: 9px; min-width: 168px; color: rgba(255,255,255,.72); font: 700 10px/1.2 Manrope, sans-serif; letter-spacing: .12em; text-transform: uppercase; }
      #startup-splash .splash-spinner { width: 22px; height: 22px; border: 2px solid rgba(255,255,255,.22); border-top-color: #f3c64b; border-radius: 50%; animation: splash-spin 900ms linear infinite; }
      #startup-splash .splash-track { width: 100%; height: 3px; overflow: hidden; border-radius: 999px; background: rgba(255,255,255,.14); }
      #startup-splash .splash-track::after { content: ""; display: block; width: 42%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, transparent, #f3c64b, transparent); animation: splash-progress 1200ms cubic-bezier(.23,1,.32,1) infinite; }
      @keyframes splash-rise { from { opacity: 0; transform: translateY(24px) scale(.95); } 65% { opacity: 1; transform: translateY(-2px) scale(1.01); } to { opacity: 1; transform: translateY(0) scale(1); } }
      @keyframes splash-zoom-cycle { 0% { opacity: 0; transform: scale(.82); } 34% { opacity: 1; transform: scale(1.08); } 58% { opacity: 1; transform: scale(1); } 82% { opacity: 1; transform: scale(1.035); } 100% { opacity: .92; transform: scale(.94); } }
      @keyframes splash-spin { to { transform: rotate(360deg); } }
      @keyframes splash-progress { from { transform: translateX(-150%); } to { transform: translateX(340%); } }
      @media (prefers-reduced-motion: reduce) { #startup-splash .splash-inner, #startup-splash img, #startup-splash .splash-spinner, #startup-splash .splash-track::after { animation: none; } }
    </style>
